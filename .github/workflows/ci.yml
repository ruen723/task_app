name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: task_app_test
          MYSQL_USER: task_app
          MYSQL_PASSWORD: ci-only-task-app-password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y default-libmysqlclient-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: mysql2://task_app:ci-only-task-app-password@127.0.0.1:3306/task_app_test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bundle exec ruby spec/rails_helper.rb
          bin/rails db:migrate
          bundle exec rspec --exclude-pattern 'spec/system/**/*_spec.rb'

  system-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: task_app_test
          MYSQL_USER: task_app
          MYSQL_PASSWORD: ci-only-task-app-password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y default-libmysqlclient-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: mysql2://task_app:ci-only-task-app-password@127.0.0.1:3306/task_app_test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          # Chrome 158とCapybara 3.40.0の互換性問題を回避するため、一時的にバージョンを固定する。
          # 正式な修正版を適用し、最新のChromeでシステムテストが全件成功した後に固定を解除する。
          # (https://github.com/teamcapybara/capybara/issues/2865).
          version=157.0.8103.78
          download_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
          base_url="https://storage.googleapis.com/chrome-for-testing-public/$version/linux64"
          for asset in chrome chromedriver; do
            archive="$asset-linux64.zip"
            curl --fail --silent --show-error --location --max-time 120 \
              --output "$download_dir/$archive" "$base_url/$archive"
            unzip -q "$download_dir/$archive" -d "$download_dir"
          done
          export CHROME_BIN="$download_dir/chrome-linux64/chrome"
          export CHROMEDRIVER_PATH="$download_dir/chromedriver-linux64/chromedriver"
          chrome_version="$("$CHROME_BIN" --version)"
          driver_version="$("$CHROMEDRIVER_PATH" --version)"
          printf '%s\n' "$chrome_version" "$driver_version"
          if [[ "$(awk '{print $NF}' <<< "$chrome_version")" != "$version" || "$(awk '{print $2}' <<< "$driver_version")" != "$version" ]]; then
            echo "Expected Chrome and ChromeDriver $version" >&2
            exit 1
          fi
          bundle exec ruby spec/rails_helper.rb
          bin/rails db:migrate
          bundle exec rspec spec/system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
